<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c">
<title>オクトーバーフェスト会場MAP</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero" id="hero">
  <div class="hero-text">
    <p class="hero-venue" id="heroVenue">OKTOBERFEST 2026</p>
    <h1 id="appTitle">オクトーバーフェスト会場MAP</h1>
    <p class="hero-sub" id="appSub"></p>
  </div>
  <select id="venueSelect" class="venue-select" aria-label="会場を選択" hidden></select>
</header>

<section class="today" id="today" hidden>
  <span class="today-badge" id="todayBadge">TODAY</span>
  <p id="todayText"></p>
</section>

<nav class="tabs" role="tablist">
  <button class="tab is-active" data-tab="map" role="tab">会場マップ</button>
  <button class="tab" data-tab="menu" role="tab">ブース一覧</button>
  <button class="tab" data-tab="schedule" role="tab">日別日程</button>
  <button class="tab" data-tab="info" role="tab">開催概要</button>
</nav>

<main>
  <!-- MAP -->
  <section class="panel is-active" id="panel-map">
    <div class="map-tools">
      <span class="hint">ピンをタップすると詳細が見られます</span>
      <div class="zoom">
        <button id="zoomOut" aria-label="縮小">－</button>
        <button id="zoomIn" aria-label="拡大">＋</button>
      </div>
    </div>
    <div class="map-scroller" id="mapScroller">
      <div class="map-inner" id="mapInner">
        <img id="mapImg" alt="会場マップ" draggable="false">
        <div id="pins"></div>
      </div>
    </div>
    <ul class="legend" id="legend"></ul>
  </section>

  <!-- MENU -->
  <section class="panel" id="panel-menu">
    <div class="chips" id="menuFilter">
      <button class="chip is-active" data-cat="all">すべて</button>
      <button class="chip" data-cat="drink">ビール</button>
      <button class="chip" data-cat="food">フード</button>
      <button class="chip" data-cat="limited">限定</button>
    </div>
    <div id="boothList"></div>
  </section>

  <!-- SCHEDULE -->
  <section class="panel" id="panel-schedule">
    <div class="date-strip" id="dateStrip"></div>
    <div id="dayDetail"></div>
  </section>

  <!-- INFO -->
  <section class="panel" id="panel-info">
    <div id="infoBody"></div>
  </section>
</main>

<footer class="foot">
  <p id="footerNotice">飲酒は20歳になってから。</p>
  <p class="updated" id="updated"></p>
</footer>

<!-- Bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <button class="sheet-close" id="sheetClose" aria-label="閉じる">×</button>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
